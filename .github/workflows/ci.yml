name: CI

on:
  push:
    branches: [main]
    paths:
      - "esphome/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "esphome/**"
      - ".github/workflows/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ESPHome
        run: pip install esphome==2026.8.1

      - name: Validate config
        run: |
          esphome config esphome/astrion-ir-extender-bk7238.yaml
          esphome config esphome/astrion-ir-extender-esp8285.yaml
