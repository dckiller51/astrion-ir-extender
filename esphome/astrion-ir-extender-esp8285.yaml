substitutions:
  name: "astrion-ir-extender"
  friendly_name: "Astrion IR Extender"

esphome:
  name: "${name}"
  name_add_mac_suffix: true
  friendly_name: "${friendly_name}"
  # Custom component exposing POST /pronto -- a raw HTTP body handler,
  # not an ESPHome native entity, specifically to accept a full Pronto
  # code in one request. ESPHome's native `text:` entity (used by an
  # earlier version of this file) caps a single value at 255 characters,
  # which many real captured Pronto codes exceed -- this replaces that
  # chunk+fire two-step workaround with a single request.
  includes:
    - my_components/astrion_api/astrion_api.h
  on_boot:
    priority: -100
    then:
      - lambda: |-
          auto *astrion_api = new AstrionHttpEndpoint();
          astrion_api->set_script(id(play_pronto_script));
          App.register_component_(astrion_api);

esp8266:
  board: esp8285
  restore_from_flash: true

logger:

# Optional: lets this extender also show up in Home Assistant for anyone
# who has it and wants to trigger/automate the extender from there too.
# Astrion Custom Dashboard itself never needs this — it always talks to
# the extender directly over HTTP (see the /pronto endpoint below), so
# this stays enabled with no encryption key/secrets file required,
# matching the "no HA required" goal for a single generic firmware.
api:

ota:
  platform: esphome

# No ssid/password here on purpose — this is ONE generic firmware flashed
# onto every unit, so the real network's credentials can't be compiled in.
# On first boot (or whenever the last-known network is unreachable), ESPHome
# falls back to the `ap:` hotspot below and serves the built-in captive
# portal for the user to enter their own WiFi -- no code, no yaml editing,
# no per-user rebuild.
wifi:
  fast_connect: true # required for hidden SSIDs: without this, ESPHome
  # waits to see the network in a scan before connecting to it, which
  # never happens for a hidden network. fast_connect connects by name
  # directly instead.

  ap:
    ssid: "${friendly_name} Setup"
    password: "astrion1234"
    # KNOWN OPEN ITEM: this SSID/password is identical across every unit
    # flashed from this same generic binary. Fine for a single extender
    # under test, but once more than one unit is being onboarded on the
    # same network at the same time, they'll all advertise the exact same
    # hotspot name and there's no way to tell them apart during setup.
    # Needs a real fix (MAC-derived suffix or similar) before this ships
    # for multi-unit setups -- flagging here rather than pretending it's
    # solved.

captive_portal:

# Still needed for the built-in entity list/UI (buttons, sensors, etc.)
# and for `web_server_base`, which the custom /pronto endpoint above
# attaches itself to -- but Astrion Custom Dashboard's actual IR command
# path is POST /pronto now, not a web_server-native entity endpoint.
web_server:
  version: 3

sensor:
  - platform: wifi_signal
    name: "${friendly_name} WiFi Signal"
    update_interval: 60s

  - platform: uptime
    name: "${friendly_name} Uptime"

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "${friendly_name} IP Address"
    ssid:
      name: "${friendly_name} SSID"
    mac_address:
      name: "${friendly_name} Mac Address"
      # Shown here (and readable at GET /text_sensor/${name}_mac_address
      # via web_server) specifically so a user can read it off by hand for
      # the app's manual-add fallback if mDNS scanning doesn't find the
      # extender automatically.

switch:
  - platform: restart
    name: "${friendly_name} Restart"

button:
  - platform: factory_reset
    name: "${friendly_name} Factory Reset"
    id: factory_reset_button
    # Erases all stored preferences, including the WiFi credentials saved
    # via the captive portal -- the way back to onboarding mode if the
    # extender is ever moved to a different network. Exposed both as its
    # own entity (callable over web_server/API) AND via the physical
    # button below, for when the extender isn't reachable over the
    # network at all anymore.

script:
  - id: play_pronto_script
    mode: queued
    parameters:
      pronto_code: string
    then:
      - logger.log:
          format: "Transmitting Pronto: %s"
          args: [ "pronto_code.c_str()" ]
      - remote_transmitter.transmit_pronto:
          transmitter_id: astrion_transmitter
          data: !lambda "return pronto_code;"

binary_sensor:
  - platform: status
    name: "${friendly_name} Status"

  - platform: gpio
    pin:
      number: GPIO0
      inverted: true
      # NOT YET VERIFIED on real hardware -- GPIO0 is the typical
      # flash/config button pin on this ESP8285 module family (same pin
      # astrion-ir-sniffer.yaml reads as `physical_button`), assumed
      # active-low hence `inverted: true`, but please confirm the button
      # actually registers a press once flashed before relying on this.
    name: "${friendly_name} Button"
    on_multi_click:
      - timing:
          - ON for at least 5s
        then:
          - button.press: factory_reset_button

status_led:
  pin: GPIO13
  # Also unverified against this specific unit -- matches
  # astrion-ir-sniffer.yaml's status_led pin, same module family, but
  # confirm it actually lights up before assuming it's right.

remote_transmitter:
  id: astrion_transmitter
  pin:
    number: GPIO4
    # Confirmed working pin: same one already validated by
    # astrion-ir-sniffer's own remote_transmitter.
  carrier_duty_percent: 50%
